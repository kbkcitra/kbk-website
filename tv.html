<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A1330">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="D'Aleena">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon-192.png">
<title>D'Aleena Guest TV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
/* Layout: one fixed screen - photo backdrop behind a centre stage, with a compact card rail pinned along the bottom. */
:root{
  --navy:#0A1330;--panel:rgba(21,31,71,.72);--panel-2:rgba(28,42,92,.86);--teal:#2FBF94;
  --fg:#EEF2FF;--muted:#9AA8D2;--line:rgba(154,168,210,.26);--warn:#F2B544;
  --display:"Outfit","Trebuchet MS",sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--navy);color:var(--fg);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}

/* ---- backdrop ---- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--navy)}
.bg-photo{position:absolute;inset:-7%;background-size:cover;background-position:center;
  opacity:0;transition:opacity .9s ease;filter:saturate(.7) contrast(1.04);
  animation:ken 34s ease-in-out infinite alternate}
.bg-photo.on{opacity:.46}
.bg-fall{position:absolute;inset:-10%;opacity:.9;
  background:conic-gradient(from 210deg at 70% 30%,#13224f,#0d1735,#1a2d63,#0A1330,#13224f);
  filter:blur(52px);animation:drift 46s ease-in-out infinite alternate}
.bg-glow{position:absolute;inset:0;
  background:radial-gradient(45vw 45vw at 82% 8%,rgba(47,191,148,.20),transparent 62%),
             radial-gradient(42vw 42vw at 12% 96%,rgba(47,191,148,.11),transparent 60%);
  animation:glow 24s ease-in-out infinite alternate}
.bg-scrim{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(10,19,48,.74) 0%,rgba(10,19,48,.40) 30%,rgba(10,19,48,.66) 68%,rgba(10,19,48,.95) 100%)}
@keyframes ken{from{transform:scale(1) translate3d(0,0,0)}to{transform:scale(1.11) translate3d(-1.6%,-1.2%,0)}}
@keyframes drift{from{transform:scale(1) rotate(0deg)}to{transform:scale(1.18) rotate(9deg)}}
@keyframes glow{from{opacity:.75;transform:translate3d(0,0,0)}to{opacity:1;transform:translate3d(-1.5%,1%,0)}}
@keyframes rise{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
 .bg-photo,.bg-fall,.bg-glow{animation:none}
 .stage-in{animation:none!important}
}

.screen{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;
  padding-block:clamp(12px,1.8vw,22px);gap:clamp(10px,1.4vw,18px)}

/* ---- header ---- */
.bar{flex:0 0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:clamp(.74rem,1.05vw,1rem);text-transform:uppercase}
.brand i{font-style:normal;color:var(--teal)}
.bar .prop{margin-left:auto;color:var(--muted);font-size:clamp(.74rem,1vw,.96rem);font-weight:500}
.clock{font-family:var(--display);font-weight:600;font-size:clamp(.95rem,1.7vw,1.7rem);font-variant-numeric:tabular-nums}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(21,31,71,.6);backdrop-filter:blur(6px)}
.lang button{font:inherit;font-family:var(--display);font-weight:600;cursor:pointer;color:var(--muted);
  background:transparent;border:0;padding:6px 14px;font-size:clamp(.68rem,.95vw,.86rem);letter-spacing:.1em}
.lang button[aria-pressed="true"]{background:var(--teal);color:#06231A}
.lang button:hover{color:var(--fg)}
.lang button[aria-pressed="true"]:hover{color:#06231A}
.lang button:focus{outline:3px solid var(--teal);outline-offset:3px;position:relative;z-index:1}

/* ---- stage ---- */
.stage{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;
  display:flex;flex-direction:column;padding-block:clamp(6px,1vw,14px)}
.stage::-webkit-scrollbar{width:8px}
.stage::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.stage-in{animation:rise .38s cubic-bezier(.2,.7,.3,1) both}
.wrap{width:100%;max-width:1180px;margin-inline:auto;margin-block:auto;display:flex;flex-direction:column;gap:clamp(11px,1.3vw,17px)}

/* welcome */
.welcome{display:flex;flex-direction:column;gap:5px}
.eyebrow{margin:0;color:var(--teal);font-weight:600;letter-spacing:.22em;text-transform:uppercase;font-size:clamp(.64rem,.92vw,.86rem)}
.welcome h1{margin:0;font-family:var(--display);font-weight:700;line-height:1;text-wrap:balance;
  font-size:clamp(2.2rem,6.6vw,5.4rem);text-shadow:0 2px 30px rgba(10,19,48,.65)}
.welcome .where{margin:.1em 0 0;font-family:var(--display);font-weight:600;color:var(--fg);opacity:.9;font-size:clamp(1rem,2vw,1.7rem)}
.welcome .sub{margin:.5em 0 0;color:var(--muted);font-size:clamp(.86rem,1.25vw,1.15rem);max-width:56ch;line-height:1.55}

/* panel content */
.ptitle{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(1.35rem,3vw,2.5rem);line-height:1.08;text-wrap:balance;
  text-shadow:0 2px 24px rgba(10,19,48,.6)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(13px)}
.d-p{margin:0;color:var(--muted);font-size:clamp(.86rem,1.25vw,1.15rem);line-height:1.55;max-width:70ch}
.d-sub{margin:0;font-family:var(--display);font-weight:600;color:var(--teal);font-size:clamp(.92rem,1.3vw,1.2rem)}
.d-list{list-style:none;margin:0;padding:0;display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.d-list li{min-width:0;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--teal);
  border-radius:0 12px 12px 0;padding:11px 15px;font-size:clamp(.86rem,1.22vw,1.08rem);line-height:1.45;font-weight:500;backdrop-filter:blur(13px)}
.d-list li.no{border-left-color:#E06A6A}
.d-list li.step{border-left-color:var(--warn)}
.d-note{background:rgba(242,181,68,.14);border:1px solid rgba(242,181,68,.44);border-radius:13px;backdrop-filter:blur(13px);
  padding:12px 16px;color:#FFE4B0;font-size:clamp(.84rem,1.16vw,1.04rem);line-height:1.5}
.d-note b{color:var(--warn)}
.d-good{background:rgba(47,191,148,.14);border:1px solid rgba(47,191,148,.42);border-radius:13px;backdrop-filter:blur(13px);
  padding:12px 16px;font-size:clamp(.84rem,1.16vw,1.04rem);line-height:1.5}
.d-good b{color:var(--teal)}
.d-kv{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(min(100%,185px),1fr))}
.d-kv div{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px 15px;backdrop-filter:blur(13px)}
.k{display:block;color:var(--muted);font-size:clamp(.62rem,.88vw,.76rem);text-transform:uppercase;letter-spacing:.14em;font-weight:600;margin-bottom:4px}
.v{display:block;font-family:var(--display);font-weight:600;font-size:clamp(1rem,1.8vw,1.6rem);line-height:1.15;word-break:break-word}
.v.code{font-family:ui-monospace,"SF Mono",Menlo,monospace;color:var(--teal);letter-spacing:.02em}
.v.price{color:var(--warn)}

.d-figs{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
figure{margin:0;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;backdrop-filter:blur(13px)}
figure img{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;background:#0b1430}
figure.tall img{aspect-ratio:3/2}
figcaption{padding:9px 13px;font-size:clamp(.76rem,1vw,.94rem);line-height:1.4;color:var(--fg)}
figcaption b{font-family:var(--display);font-weight:600;color:var(--teal);display:block;margin-bottom:2px;font-size:1.05em}
.d-homes{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(min(100%,218px),1fr))}
.home{min-width:0;position:relative;background:var(--panel);border:1px solid var(--line);border-radius:15px;
  overflow:hidden;display:flex;flex-direction:column;backdrop-filter:blur(13px)}
.home.here{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset}
.home img{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;background:#0b1430}
.hbody{padding:10px 13px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.hbody b{font-family:var(--display);font-weight:600;font-size:clamp(.94rem,1.35vw,1.2rem);line-height:1.15}
.hwhere{color:var(--teal);font-size:clamp(.66rem,.9vw,.78rem);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.hdetail{color:var(--muted);font-size:clamp(.72rem,.96vw,.86rem);line-height:1.4;margin-top:3px}
.hprice{margin-top:7px;font-family:var(--display);font-weight:700;font-size:clamp(1rem,1.5vw,1.3rem);color:var(--fg)}
.hprice i{font-style:normal;font-weight:500;font-size:.62em;color:var(--muted)}
.hhere{position:absolute;top:9px;left:9px;background:var(--teal);color:#06231A;font-family:var(--display);
  font-weight:700;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:999px}
.d-gal{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(min(100%,145px),1fr))}
.d-gal figure img{aspect-ratio:1/1}
.d-gal figcaption{padding:7px 10px;font-size:clamp(.72rem,.94vw,.86rem);font-weight:500}

.d-qr{display:flex;gap:clamp(13px,1.5vw,20px);align-items:center;flex-wrap:wrap;background:var(--panel-2);
  border:1px solid rgba(47,191,148,.4);border-radius:16px;padding:clamp(13px,1.4vw,18px);backdrop-filter:blur(13px)}
.d-qr>div.t{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:4px}
.d-qr b{font-family:var(--display);font-weight:600;font-size:clamp(.98rem,1.5vw,1.3rem)}
.d-qr .phone{margin-top:7px;padding-top:9px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:1px}
.d-qr .phone span{color:var(--muted);font-size:clamp(.68rem,.92vw,.8rem);text-transform:uppercase;letter-spacing:.14em;font-weight:600}
.d-qr .phone strong{font-family:var(--display);font-weight:700;color:var(--teal);font-variant-numeric:tabular-nums;
  font-size:clamp(1.12rem,2vw,1.75rem);letter-spacing:.01em}
.d-menu{columns:4 230px;column-gap:13px}
.mcat{break-inside:avoid;margin:0 0 13px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:12px 15px 13px;backdrop-filter:blur(13px)}
.mcat h4{margin:0 0 2px;font-family:var(--display);font-weight:600;color:var(--teal);font-size:clamp(.9rem,1.22vw,1.08rem);line-height:1.2}
.mcat .mnote{display:block;color:var(--muted);font-size:clamp(.68rem,.9vw,.78rem);margin-bottom:7px}
.mrow{display:flex;gap:9px;align-items:baseline;padding:3px 0;font-size:clamp(.78rem,1.02vw,.92rem);line-height:1.35}
.mrow .mi{flex:1 1 auto;min-width:0}
.mrow .mi i{font-style:normal;color:var(--muted);font-size:.86em}
.mrow .mp{flex:0 0 auto;font-weight:600;font-variant-numeric:tabular-nums;color:var(--fg);opacity:.95}
.qr{flex:0 0 auto;width:clamp(100px,10vw,152px);height:clamp(100px,10vw,152px);background:#fff;border-radius:11px;padding:7px;display:grid;place-items:center}
.qr svg{width:100%;height:100%;display:block}
.qr.fail::after{content:"QR";font-family:var(--display);font-weight:700;color:#0A1330}

/* ---- bottom rail ---- */
.rail{flex:0 0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(118px,1fr);
  gap:8px;overflow-x:auto;overflow-y:hidden;padding-top:11px;padding-bottom:3px;
  border-top:1px solid var(--line);scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rcard{position:relative;overflow:hidden;min-width:0;text-align:left;font:inherit;color:var(--fg);cursor:pointer;
  background:rgba(21,31,71,.6);border:1px solid var(--line);border-radius:13px;backdrop-filter:blur(10px);
  padding:9px 11px;display:flex;flex-direction:column;gap:3px;
  transition:background .14s,border-color .14s,transform .14s}
.rcard .num{font-family:var(--display);font-weight:700;font-size:.66rem;letter-spacing:.14em;color:var(--muted)}
.rcard b{font-family:var(--display);font-weight:600;font-size:clamp(.8rem,1.08vw,.98rem);line-height:1.18;text-wrap:balance}
.rcard.hot{border-color:rgba(242,181,68,.55)}
.rcard.hot .num{color:var(--warn)}
.rcard[aria-current="true"]{background:var(--teal);border-color:var(--teal);color:#06231A}
.rcard[aria-current="true"] .num{color:rgba(6,35,26,.7)}
.rcard:hover{background:var(--panel-2);border-color:rgba(47,191,148,.5)}
.rcard[aria-current="true"]:hover{background:#43d4a8}
.rcard:focus{outline:3px solid var(--teal);outline-offset:3px;transform:translateY(-3px)}
@media (prefers-reduced-motion:reduce){.rcard{transition:none}.rcard:focus{transform:none}}

.autobar{position:absolute;left:0;bottom:0;height:3px;width:0;background:#06231A;opacity:.5;
  animation:autofill 10s linear forwards;pointer-events:none}
@keyframes autofill{from{width:0}to{width:100%}}
@media (prefers-reduced-motion:reduce){.autobar{animation:none;width:100%}}
body.idle{cursor:none}
.tvoff{position:fixed;inset:0;z-index:8;background:#0A1330;display:grid;place-items:center;padding:24px}
.tvoff-card{width:min(640px,100%);text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.tvoff-card h2{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,3.4vw,2.6rem);line-height:1.12;text-wrap:balance}
.tvoff-card p{margin:0;color:var(--muted);font-size:clamp(.95rem,1.5vw,1.3rem);line-height:1.6;max-width:46ch}
.tvoff-card p b{color:var(--teal);font-family:var(--display);font-weight:700}
.tvoff-card .save{width:min(320px,100%)}
.foot{flex:0 0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:clamp(.7rem,.94vw,.86rem)}
.foot .dot{color:var(--teal)}
.fbtns{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.setup-btn{background:transparent;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:.95em;padding:5px 13px;border-radius:999px;cursor:pointer}
.setup-btn:hover,.setup-btn:focus{border-color:var(--teal);color:var(--teal)}
.setup-btn.key{border-color:rgba(47,191,148,.45);color:var(--teal)}

/* ---- setup ---- */
.setup{position:fixed;inset:0;z-index:9;background:rgba(10,19,48,.97);display:grid;place-items:center;padding:24px}
.setup-card{width:min(520px,100%);background:#151F47;border:1px solid var(--line);border-radius:20px;padding:clamp(20px,3vw,32px);display:flex;flex-direction:column;gap:15px}
.setup-card h2{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(1.25rem,2.3vw,1.7rem)}
.setup-card p{margin:0;color:var(--muted);font-size:.93rem;line-height:1.5}
label{display:flex;flex-direction:column;gap:7px;font-size:.76rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600}
select{font:inherit;font-size:1.05rem;text-transform:none;letter-spacing:0;color:var(--fg);background:var(--navy);border:1px solid var(--line);border-radius:11px;padding:12px 13px}
select:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.save{font-family:var(--display);font-weight:600;font-size:1.05rem;background:var(--teal);color:#06231A;border:0;border-radius:11px;padding:14px;cursor:pointer}
.save:hover{background:#43d4a8}

@media (max-width:640px){
 html,body{overflow:auto}
 .screen{height:auto;min-height:100%}
 .stage{overflow:visible;justify-content:flex-start}
 .rail{position:sticky;bottom:0;background:rgba(10,19,48,.9);backdrop-filter:blur(10px)}
}
</style>
</head>
<body>

<div class="bg">
  <div class="bg-fall" id="bgFall"></div>
  <div class="bg-photo" id="bgPhoto"></div>
  <div class="bg-glow"></div>
  <div class="bg-scrim"></div>
</div>

<div class="screen">
  <header class="bar">
    <div class="brand">D'Aleena <i>Collection</i></div>
    <div class="lang" id="langBar">
      <button type="button" data-nav data-lang="ms" aria-pressed="true">BM</button>
      <button type="button" data-nav data-lang="en" aria-pressed="false">ENG</button>
    </div>
    <div class="prop" id="propName"></div>
    <div class="clock" id="clock">--:--</div>
  </header>

  <main class="stage" id="stage"></main>

  <nav class="rail" id="rail"></nav>

  <div class="foot">
    <span>kbkcitrawaja.my</span>
    <span class="dot">&bull;</span>
    <span id="footHelp"></span>
    <span class="fbtns">
      <button class="setup-btn" id="fsBtn" type="button"></button>
      <button class="setup-btn key" id="tvBtn" type="button"></button>
      <button class="setup-btn" id="openSetup" type="button"></button>
    </span>
  </div>
</div>

<div class="tvoff" id="tvoff" hidden>
  <div class="tvoff-card">
    <h2 id="tvoffTitle"></h2>
    <p id="tvoffLead"></p>
    <button class="save" id="tvBack" type="button"></button>
  </div>
</div>

<div class="setup" id="setup" hidden>
  <div class="setup-card">
    <h2 id="setupTitle"></h2>
    <p id="setupLead"></p>
    <label for="selProp"><span id="lblProp"></span><select id="selProp"></select></label>
    <label for="selRoom"><span id="lblRoom"></span><select id="selRoom"></select></label>
    <button class="save" id="saveSetup" type="button"></button>
  </div>

/* ---------- state ---------- */
var KEY="daleena-tv-room",LKEY="daleena-tv-lang",SECS=[],CUR=0,PROP=null,ROOM=null;
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){}return null;}

function qrInto(el,text){
 try{var q=qrcode(0,"M");q.addData(text);q.make();
  el.innerHTML=q.createSvgTag({cellSize:6,margin:0,scalable:true});
  var s=el.querySelector("svg");if(s){s.removeAttribute("width");s.removeAttribute("height");}
 }catch(e){el.classList.add("fail");}
}
function blockHTML(b){
 if(b.t==="p")   return '<p class="d-p">'+T(b.v)+'</p>';
 if(b.t==="sub") return '<p class="d-sub">'+T(b.v)+'</p>';
 if(b.t==="note")return '<div class="d-note">'+T(b.v)+'</div>';
 if(b.t==="good")return '<div class="d-good">'+T(b.v)+'</div>';
 if(b.t==="list")return '<ul class="d-list">'+b.items.map(function(i){
   return '<li class="'+(i.no?"no":i.step?"step":"")+'">'+T(i)+'</li>';}).join("")+'</ul>';
 if(b.t==="kv")  return '<div class="d-kv">'+b.items.map(function(i){
   return '<div><span class="k">'+T(i.k)+'</span><span class="v'+(i.code?" code":"")+(i.price?" price":"")+'">'+T(i.v)+'</span></div>';}).join("")+'</div>';
 if(b.t==="figs")return '<div class="d-figs">'+b.items.map(function(i){
   return '<figure class="tall"><img src="'+(IMG[i.k]||"")+'" alt="'+T(i.h)+'"><figcaption><b>'+T(i.h)+'</b>'+T(i.c)+'</figcaption></figure>';}).join("")+'</div>';
 if(b.t==="homes")return '<div class="d-homes">'+HOMES.map(function(h){
   var here=(h.prop===PROP&&h.room===ROOM);
   return '<article class="home'+(here?" here":"")+'">'
        + (here?'<span class="hhere">'+T(UI_HERE)+'</span>':'')
        + '<img src="'+roomPhoto(h.prop,h.room)+'" alt="'+h.room+'" loading="lazy">'
        + '<div class="hbody"><span class="hwhere">'+PROPS[h.prop].shortName+'</span>'
        + '<b>'+h.room+'</b><span class="hdetail">'+T(h.detail)+'</span>'
        + '<span class="hprice">RM'+h.price+' <i>'+T(UI_NIGHT)+'</i></span></div></article>';}).join("")+'</div>';
 if(b.t==="gal") return '<div class="d-gal">'+b.items.map(function(i){
   return '<figure><img src="'+(IMG["nat_"+i.k]||"")+'" alt="'+T(i.c)+'"><figcaption>'+T(i.c)+'</figcaption></figure>';}).join("")+'</div>';
 if(b.t==="qr")  return '<div class="d-qr"><div class="qr" data-qr="'+b.url.replace(/"/g,"&quot;")+'"></div><div class="t"><b>'+T(b.label)+'</b><p class="d-p">'+T(b.note)+'</p>'
   +(b.phone?'<div class="phone"><span>'+T(b.phone.label)+'</span><strong>'+b.phone.num+'</strong></div>':'')+'</div></div>';
 if(b.t==="menu")return '<div class="d-menu">'+MENU.map(function(c){
   return '<section class="mcat"><h4>'+T(c.c)+'</h4>'+(c.n?'<span class="mnote">'+T(c.n)+'</span>':'')
        + c.rows.map(function(r){return '<div class="mrow"><span class="mi">'+r.i+(r.s?' <i>'+r.s+'</i>':'')+'</span><span class="mp">'+r.p+'</span></div>';}).join("")
        + '</section>';}).join("")+'</div>';
 return "";
}
function showSection(i){
 var s=SECS[i];if(!s)return;
 CUR=i;
 var stage=document.getElementById("stage"),html;
 if(s.home){
  html='<div class="wrap welcome">'
     + '<p class="eyebrow">'+T(UI.welcome)+'</p>'
     + '<h1>'+ROOM+'</h1>'
     + '<p class="where">'+PROPS[PROP].name+'</p>'
     + '<p class="sub">'+T(UI.heroSub)+'</p></div>';
 }else{
  html='<div class="wrap"><h2 class="ptitle">'+T(s.title)+'</h2>'+s.blocks.map(blockHTML).join("")+'</div>';
 }
 stage.innerHTML=html;
 stage.classList.remove("stage-in");void stage.offsetWidth;stage.classList.add("stage-in");
 stage.scrollTop=0;
 Array.prototype.forEach.call(stage.querySelectorAll("[data-qr]"),function(el){qrInto(el,el.getAttribute("data-qr"));});
 Array.prototype.forEach.call(document.querySelectorAll("#rail .rcard"),function(b,j){
  b.setAttribute("aria-current",j===i?"true":"false");});
 var act=document.querySelector('#rail .rcard[aria-current="true"]');
 if(act&&act.scrollIntoView)act.scrollIntoView({block:"nearest",inline:"nearest"});
 markAuto();
}
function setBackdrop(){
 var src=roomPhoto(PROP,ROOM),el=document.getElementById("bgPhoto"),fall=document.getElementById("bgFall");
 if(!src){el.classList.remove("on");el.style.backgroundImage="";fall.hidden=false;return;}
 el.style.backgroundImage='url("'+src+'")';el.classList.add("on");fall.hidden=true;
}
function paintUI(){
 document.getElementById("footHelp").textContent=T(UI.foot);
 document.getElementById("openSetup").textContent=T(UI.change);
 document.getElementById("setupTitle").textContent=T(UI.setupTitle);
 document.getElementById("setupLead").textContent=T(UI.setupLead);
 document.getElementById("lblProp").textContent=T(UI.lblProp);
 document.getElementById("lblRoom").textContent=T(UI.lblRoom);
 document.getElementById("saveSetup").textContent=T(UI.save);
 document.getElementById("fsBtn").textContent=T(fsOn()?UI.fsOff:UI.fsOn);
 document.getElementById("tvBtn").textContent=T(UI.tv);
 document.getElementById("tvoffTitle").textContent=T(UI.tvTitle);
 document.getElementById("tvoffLead").innerHTML=T(UI.tvLead);
 document.getElementById("tvBack").textContent=T(UI.tvBack);
 Array.prototype.forEach.call(document.querySelectorAll("#langBar button"),function(b){
  b.setAttribute("aria-pressed",b.getAttribute("data-lang")===LANG?"true":"false");});
}
function render(key,room,keepIndex){
 var p=PROPS[key];if(!p)return;
 PROP=key;ROOM=room;
 document.getElementById("propName").textContent=p.name;
 SECS=sections(p);
 paintUI();setBackdrop();
 document.getElementById("rail").innerHTML=SECS.map(function(s,i){
  return '<button class="rcard'+(s.hot?" hot":"")+'" type="button" data-nav data-i="'+i+'" aria-current="false">'
       + '<span class="num">'+(s.home?"\u2302":i)+'</span><b>'+T(s.tile)+'</b></button>';
 }).join("");
 showSection(keepIndex&&SECS[CUR]?CUR:0);
}
function setLang(l){
 if(l===LANG)return;
 LANG=l;store(LKEY,l);
 render(PROP,ROOM,true);
 fillRooms();
}
document.getElementById("langBar").addEventListener("click",function(e){
 var b=e.target.closest("[data-lang]");if(b)setLang(b.getAttribute("data-lang"));
});
document.getElementById("rail").addEventListener("click",function(e){
 var t=e.target.closest("[data-i]");if(t)showSection(parseInt(t.getAttribute("data-i"),10));
});

/* ---------- remote navigation ---------- */
function rail(){return Array.prototype.slice.call(document.querySelectorAll("#rail .rcard"));}
document.addEventListener("keydown",function(e){
 if(!document.getElementById("setup").hidden)return;
 if(!document.getElementById("tvoff").hidden)return;
 var k=e.key,stage=document.getElementById("stage"),inLang=document.activeElement&&document.activeElement.closest("#langBar");
 if(k==="ArrowRight"||k==="ArrowLeft"){
  e.preventDefault();
  if(inLang){var bs=rail();if(bs[CUR])bs[CUR].focus();return;}
  var n=CUR+(k==="ArrowRight"?1:-1);
  if(n<0)n=SECS.length-1; if(n>=SECS.length)n=0;
  showSection(n);var b=rail()[n];if(b)b.focus();
  return;
 }
 if(k==="ArrowUp"){
  e.preventDefault();
  if(inLang)return;
  if(stage.scrollTop<=2){document.querySelector('#langBar button[aria-pressed="true"]').focus();}
  else stage.scrollBy({top:-Math.round(stage.clientHeight*.7),behavior:"smooth"});
  return;
 }
 if(k==="ArrowDown"){
  e.preventDefault();
  if(inLang){var r=rail();if(r[CUR])r[CUR].focus();return;}
  stage.scrollBy({top:Math.round(stage.clientHeight*.7),behavior:"smooth"});
  return;
 }
 if(k==="Escape"||k==="Backspace"||k==="GoBack"){e.preventDefault();showSection(0);var h=rail()[0];if(h)h.focus();return;}
 if(/^[0-9]$/.test(k)){var i=parseInt(k,10);if(SECS[i]){showSection(i);var bb=rail()[i];if(bb)bb.focus();}}
});

/* ---------- setup ---------- */
function fillRooms(){
 var p=PROPS[document.getElementById("selProp").value],sel=document.getElementById("selRoom");
 if(!sel)return;
 var keep=sel.value;
 sel.innerHTML="";
 (p?p.rooms:[]).forEach(function(r){var o=document.createElement("option");o.value=r;o.textContent=r;sel.appendChild(o);});
 if(keep)sel.value=keep;
}
function openSetup(){
 var saved=(store(KEY)||"").split("|"),sp=document.getElementById("selProp");
 sp.innerHTML="";
 Object.keys(PROPS).forEach(function(k){var o=document.createElement("option");o.value=k;o.textContent=PROPS[k].name;sp.appendChild(o);});
 if(saved[0]&&PROPS[saved[0]])sp.value=saved[0];
 fillRooms();
 if(saved[1])document.getElementById("selRoom").value=saved[1];
 document.getElementById("setup").hidden=false;
}
document.getElementById("selProp").addEventListener("change",fillRooms);
document.getElementById("openSetup").addEventListener("click",openSetup);
document.getElementById("saveSetup").addEventListener("click",function(){
 var k=document.getElementById("selProp").value,r=document.getElementById("selRoom").value;
 store(KEY,k+"|"+r);document.getElementById("setup").hidden=true;CUR=0;render(k,r);autoStart();
});

/* ---------- auto-rotate through the cards ---------- */
var AUTO_MS=10000,RESUME_MS=60000,autoT=null,resumeT=null,idleT=null,AUTO=true;
function markAuto(){
 var old=document.querySelector("#rail .autobar");if(old)old.parentNode.removeChild(old);
 if(!AUTO)return;
 var c=document.querySelector('#rail .rcard[aria-current="true"]');if(!c)return;
 var bar=document.createElement("i");bar.className="autobar";c.appendChild(bar);
}
function autoStep(){
 if(!AUTO)return;
 var n=CUR+1;if(n>=SECS.length)n=0;
 showSection(n);
}
function autoStart(){
 AUTO=true;clearInterval(autoT);autoT=setInterval(autoStep,AUTO_MS);markAuto();
}
function autoStop(){
 AUTO=false;clearInterval(autoT);autoT=null;
 var old=document.querySelector("#rail .autobar");if(old)old.parentNode.removeChild(old);
 clearTimeout(resumeT);resumeT=setTimeout(function(){showSection(0);autoStart();},RESUME_MS);
}
function activity(){
 document.body.classList.remove("idle");
 clearTimeout(idleT);idleT=setTimeout(function(){document.body.classList.add("idle");},4000);
 autoStop();
}
["keydown","mousedown","touchstart","wheel"].forEach(function(ev){
 document.addEventListener(ev,activity,{passive:true});
});

/* ---------- full screen & watch TV ---------- */
function fsOn(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function toggleFS(){
 try{
  if(fsOn()){(document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);}
  else{var e=document.documentElement;(e.requestFullscreen||e.webkitRequestFullscreen||function(){}).call(e);}
 }catch(err){}
}
function fsLabel(){document.getElementById("fsBtn").textContent=T(fsOn()?UI.fsOff:UI.fsOn);}
document.addEventListener("fullscreenchange",fsLabel);
document.addEventListener("webkitfullscreenchange",fsLabel);
document.getElementById("fsBtn").addEventListener("click",toggleFS);
document.getElementById("tvBtn").addEventListener("click",function(){
 autoStop();clearTimeout(resumeT);
 if(fsOn())toggleFS();
 document.getElementById("tvoff").hidden=false;
 document.getElementById("tvBack").focus();
});
document.getElementById("tvBack").addEventListener("click",function(){
 document.getElementById("tvoff").hidden=true;
 showSection(0);autoStart();
});

/* ---------- clock ---------- */
function tick(){
 var el=document.getElementById("clock");
 try{el.textContent=new Intl.DateTimeFormat("en-GB",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Kuala_Lumpur"}).format(new Date());}
 catch(e){var d=new Date();el.textContent=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);}
}
tick();setInterval(tick,20000);

(function start(){
 var l=store(LKEY);if(l==="en"||l==="ms")LANG=l;
 var saved=(store(KEY)||"").split("|");
 if(saved[0]&&PROPS[saved[0]]&&saved[1]){render(saved[0],saved[1]);autoStart();}
 else{render("inn","Deluxe Family");openSetup();}
})();
</script>

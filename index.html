<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="KBK Citra Waja – diversified business services in one platform: D'Aleena Collection stays, Warisanku Barbershop, Ahmed Stationery and Mat Satay Kodiang, Kedah.">
<meta property="og:type" content="website"><meta property="og:url" content="https://kbkcitrawaja.my/">
<meta property="og:title" content="KBK Citra Waja"><meta property="og:description" content="Stays, barbershop, stationery and satay in Kodiang &amp; Sungai Petani, Kedah. Book and chat on WhatsApp.">
<meta property="og:image" content="https://kbkcitrawaja.my/og.jpg"><meta name="theme-color" content="#0A1330">
<link rel="icon" href="/favicon.png"><style>*,*::before,*::after{box-sizing:border-box}body{margin:0}</style></head><body>
<title>KBK Citra Waja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Zetta:wght@300;400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0A1330;          /* deep navy ground */
  --bg-2:#0F1B40;        /* raised navy */
  --line:#223262;        /* hairline */
  --ink:#EEF1F8;         /* primary text */
  --ink-2:#A9B3CE;       /* secondary text */
  --accent:#2FBF94;      /* KBK teal */
  --tbd:#F2C66D;         /* placeholder marker */
  --display:"Lexend Zetta","Lexend",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;padding-inline:clamp(16px,4vw,40px)}
a{color:inherit}
.wrap{max-width:1180px;margin-inline:auto}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-inline:calc(-1*clamp(16px,4vw,40px));padding:14px clamp(16px,4vw,40px)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-family:var(--display);font-weight:400;font-size:13px;letter-spacing:.08em;text-decoration:none;white-space:nowrap}
nav{display:flex;gap:clamp(12px,3vw,28px);font-size:14px;color:var(--ink-2)}
nav a{text-decoration:none}
nav a:hover,nav a:focus-visible{color:var(--ink)}
.wa-btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#06251B;font-weight:600;font-size:14px;padding:9px 16px;border-radius:999px;text-decoration:none;white-space:nowrap}
@media (max-width:640px){nav .hide-sm{display:none}}

/* type */
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1,h2{font-family:var(--display);font-weight:300;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,5.2vw,54px);line-height:1.15}
h2{font-size:clamp(20px,3vw,32px);line-height:1.2}
h3{font-size:18px;font-weight:600;margin:0}
.lead{font-size:clamp(16px,1.6vw,19px);color:var(--ink-2);max-width:60ch;text-wrap:pretty}
.center{text-align:center;margin-inline:auto}
section{padding-block:clamp(48px,8vw,96px)}
section+section{border-top:1px solid var(--line)}

/* hero */
.hero{padding-block:clamp(56px,10vw,120px) clamp(40px,6vw,72px)}
.hero h1{margin-block:14px 18px}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:28px;color:var(--ink-2);font-size:14px}
.hero .meta b{color:var(--ink);font-weight:600}

/* enterprise cards (the Mahindra-style grid) */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:40px}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
.card{position:relative;display:block;aspect-ratio:16/10;max-width:100%;border-radius:var(--r);overflow:hidden;text-decoration:none;isolation:isolate}
.card .art{position:absolute;inset:0;z-index:-2;transition:transform .6s ease}
.card::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 35%,rgba(5,10,28,.85))}
.card:hover .art,.card:focus-visible .art{transform:scale(1.04)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.card .label{position:absolute;left:clamp(18px,3vw,32px);right:18px;bottom:clamp(18px,3vw,28px)}
.card .kind{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.card .name{display:inline-flex;align-items:center;gap:8px;font-size:clamp(20px,2.4vw,26px);font-weight:500;color:#fff;padding-bottom:8px;border-bottom:1.5px solid rgba(255,255,255,.85);margin-top:4px}
.card .name svg{transition:transform .25s ease}
.card:hover .name svg{transform:translate(3px,-3px)}
.art svg.motif{position:absolute;right:-4%;top:-6%;width:62%;height:auto;opacity:.22;stroke:#fff;fill:none;stroke-width:1.2}
.art .photo-note{position:absolute;top:14px;left:16px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55);border:1px dashed rgba(255,255,255,.35);padding:3px 8px;border-radius:6px}

/* one-contact strip */
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:36px}
@media (max-width:760px){.strip{grid-template-columns:1fr}}
.strip p{color:var(--ink-2);margin:6px 0 0}

/* enterprise page */
.back{display:inline-flex;gap:8px;align-items:center;color:var(--ink-2);text-decoration:none;font-size:14px;margin-top:28px}
.back:hover{color:var(--ink)}
.ent-hero{position:relative;border-radius:var(--r);overflow:hidden;min-height:clamp(260px,40vw,420px);display:flex;align-items:flex-end;margin-top:18px;isolation:isolate}
.ent-hero .art{position:absolute;inset:0;z-index:-2}
.ent-hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 20%,rgba(5,10,28,.9))}
.ent-hero .in{padding:clamp(22px,4vw,44px)}
.ent-hero h1{color:#fff;margin-top:8px}
.ent-hero p{color:rgba(255,255,255,.8);max-width:56ch;margin:12px 0 0}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:32px}
@media (max-width:760px){.cols3{grid-template-columns:1fr}}
.cols3 p{color:var(--ink-2);margin:8px 0 0}
.feat h3::before{content:"";display:block;width:22px;height:2px;background:var(--accent);margin-bottom:14px}

.price-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:22px;margin-top:32px}
.pg{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.pg .sub{color:var(--ink-2);font-size:14px;margin:4px 0 12px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-block:11px;border-top:1px solid var(--line)}
.row span:first-child{color:var(--ink)}
.row small{display:block;color:var(--ink-2);font-size:13px}
.price{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.price em{font-style:normal;font-weight:400;color:var(--ink-2);font-size:13px}

.steps{list-style:none;padding:0;margin:32px 0 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;counter-reset:s}
@media (max-width:860px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.steps{grid-template-columns:1fr}}
.steps li{counter-increment:s;border-top:1px solid var(--line);padding-top:16px}
.steps li::before{content:"Step " counter(s);display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px}
.steps p{color:var(--ink-2);margin:6px 0 0;font-size:15px}

.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:32px}
@media (max-width:760px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ph{aspect-ratio:4/3;max-width:100%;border-radius:10px;border:1px dashed var(--line);background:var(--bg-2);display:grid;place-items:center;color:var(--ink-2);font-size:12px;letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:8px}
.ph.wide{grid-column:span 2;aspect-ratio:auto}

.stories{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:22px;margin-top:32px}
.story{border:1px dashed var(--line);border-radius:var(--r);padding:24px;color:var(--ink-2)}
.story q{display:block;font-size:17px;color:var(--ink);quotes:"“" "”";margin-bottom:14px}

.contact{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:start;margin-top:32px}
@media (max-width:760px){.contact{grid-template-columns:1fr}}
.contact dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:12px 22px}
.contact dt{color:var(--ink-2);font-size:14px}
.contact dd{margin:0;overflow-wrap:anywhere}
.cta-box{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.cta-box p{color:var(--ink-2);margin:8px 0 18px}

.tbd{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tbd);border:1px dashed var(--tbd);border-radius:6px;padding:1px 7px;vertical-align:middle;font-weight:600}

footer{border-top:1px solid var(--line);padding-block:36px;color:var(--ink-2);font-size:14px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
.review-note{margin-top:22px;font-size:13px;color:var(--ink-2)}

.brand{display:inline-flex;align-items:center;gap:10px}
.brand img{height:30px;width:auto}
.art img.cover{width:100%;height:100%;object-fit:cover;display:block}
.card::after{background:linear-gradient(180deg,rgba(5,10,28,.05) 30%,rgba(5,10,28,.9))!important}
.ent-hero::after{background:linear-gradient(180deg,rgba(5,10,28,.1) 10%,rgba(5,10,28,.92))!important}
.card .badge{position:absolute;top:14px;left:16px;height:34px;width:auto;max-width:40%;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
.ent-hero{min-height:clamp(340px,52vw,520px)!important}
.fb{color:var(--accent);text-decoration:none;font-weight:600;font-size:14px}
.card .logo{position:absolute;inset:0 0 30% 0;display:grid;place-items:center;z-index:-1}
.card .logo img{max-width:46%;max-height:62%;object-fit:contain;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
.ent-logo{height:64px;width:auto;margin-bottom:14px}
.subhead{padding-top:14px;margin-top:4px;border-top:1px solid var(--line);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
.subhead+.row{border-top:0}
.row.tier span:first-child{color:var(--ink-2);padding-left:12px}
.src{margin-top:18px;font-size:12.5px;color:var(--ink-2)}
.src b{color:var(--ink);font-weight:600}
.locs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px;margin-top:32px}
.loc{border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:6px}
.loc p{margin:0;overflow-wrap:anywhere;color:var(--ink-2);font-size:14.5px}
.loc a{color:var(--accent);font-size:14px;font-weight:600;text-decoration:none;margin-top:6px}
.loc a:hover{text-decoration:underline}
.pricecols{display:flex;gap:18px}
.pricecols .price{min-width:54px;text-align:right}
.colhead{display:flex;justify-content:flex-end;gap:18px;font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.08em}
.colhead span{min-width:54px;text-align:right}

.ourstory{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,5vw,64px);margin-top:36px;align-items:start}
@media (max-width:860px){.ourstory{grid-template-columns:1fr}}
.ceo{position:sticky;top:90px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (max-width:860px){.ceo{position:static}}
.portrait{aspect-ratio:4/5;max-width:100%;background:linear-gradient(160deg,#1B2C5E 0%,#0C1638 70%);display:grid;place-items:center;position:relative}
.portrait .ini{font-family:var(--display);font-size:clamp(40px,7vw,64px);font-weight:300;color:rgba(255,255,255,.85);letter-spacing:.06em}
.portrait .note{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.ceo .body{padding:22px 24px 26px}
.ceo h3{font-size:19px}
.ceo .role{color:var(--accent);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.ceo p{color:var(--ink-2);margin:12px 0 0;font-size:15px}
.story-intro{font-size:clamp(17px,1.8vw,20px);line-height:1.6;color:var(--ink);margin:0 0 28px;text-wrap:pretty}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tl li{position:relative;padding:0 0 26px 34px}
.tl li::before{content:"";position:absolute;left:0;top:5px;width:15px;height:15px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.tl li.now::before{background:var(--accent)}
.tl .tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.tl h3{margin-top:4px}
.tl p{color:var(--ink-2);margin:6px 0 0;font-size:15px;max-width:60ch}
.story-close{border-top:1px solid var(--line);padding-top:22px;color:var(--ink-2);font-size:15.5px;max-width:62ch}
.hq{grid-column:1/-1;background:linear-gradient(120deg,#0F3B45 0%,#123056 100%);border:1px solid #2A6A74;border-radius:var(--r);padding:clamp(20px,3vw,30px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px 32px}
.hq .who .eyebrow{color:#9FE8CF}
.hq h3{font-size:20px;margin-top:4px}
.hq .facts{display:flex;flex-wrap:wrap;gap:6px 28px;color:#D6E6EC;font-size:15px}
.hq .facts span{overflow-wrap:anywhere}
.hq .wa-btn{flex:none}

.teaser{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(22px,4vw,48px);align-items:center;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:clamp(22px,4vw,40px)}
@media (max-width:640px){.teaser{grid-template-columns:1fr}}
.t-portrait img,.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.t-portrait{overflow:hidden;width:clamp(120px,16vw,170px);aspect-ratio:4/5;border-radius:12px;background:linear-gradient(160deg,#1B2C5E 0%,#0C1638 70%);display:grid;place-items:center;font-family:var(--display);font-size:30px;font-weight:300;color:rgba(255,255,255,.85)}
.read-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--accent);color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;padding:11px 20px;border-radius:999px}
.read-btn:hover,.read-btn:focus-visible{background:var(--accent);color:#06251B}
.read-btn svg{transition:transform .2s}.read-btn:hover svg{transform:translate(2px,-2px)}
.story-page{padding-top:clamp(24px,4vw,40px)}

.tl li{padding-bottom:40px}
.tl p+p{margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips span{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:4px 11px;color:var(--ink);background:var(--bg-2)}
.pull{margin:16px 0 0;padding:12px 16px;border-left:2px solid var(--accent);background:var(--bg-2);border-radius:0 10px 10px 0;color:var(--ink);font-size:14.5px;max-width:60ch}
.pull cite{display:block;font-style:normal;color:var(--ink-2);font-size:12.5px;margin-top:6px}
.won{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:8px 14px;border-radius:10px;background:rgba(47,191,148,.12);border:1px solid rgba(47,191,148,.45);color:var(--ink);font-weight:600;font-size:14.5px}.won::before{content:"★";color:var(--accent)}
.row-note{margin:8px 0 36px;padding:20px 22px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg-2)}
.row-note h3{margin:0 0 6px}.row-note p{margin:0;color:var(--ink-2);font-size:15px}
.lots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.lots div{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12.5px;color:var(--ink-2)}.lots b{display:block;color:var(--accent);font-size:12px;letter-spacing:.08em}
@media (max-width:560px){.lots{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rv{border:1px solid var(--line);border-radius:var(--r);padding:22px;background:var(--bg-2);display:flex;flex-direction:column;gap:12px}
.rv .who{display:flex;align-items:center;gap:12px}
.rv .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#06231B;background:var(--accent);flex:none}
.rv .nm{font-weight:600;color:var(--ink)}.rv .mt{font-size:12.5px;color:var(--ink-2)}
.rv .st{color:#F5C451;letter-spacing:2px;font-size:14px}
.rv q{display:block;color:var(--ink);font-size:15.5px;quotes:"“" "”"}
.rv .en{color:var(--ink-2);font-size:13.5px;margin:0}
.rv .src{font-size:12px;color:var(--ink-2);margin-top:auto}
.rv-more{margin-top:22px;color:var(--ink-2);font-size:14.5px}.rv-more p{margin:0 0 10px}.rv-all{display:flex;flex-wrap:wrap;gap:10px}.rv-all a{color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:7px 14px;text-decoration:none;font-size:14px}.rv-all a:hover{border-color:var(--accent)}.rvlink{color:var(--ink-2);text-decoration:none}.rvlink u{color:var(--accent)}
.rv-empty{border:1px dashed var(--line);border-radius:var(--r);padding:24px;color:var(--ink-2)}
.ourstory{display:block!important;max-width:780px;margin-top:32px}
.ceo{position:static!important;display:grid;grid-template-columns:120px minmax(0,1fr);align-items:center;margin-bottom:34px}
.ceo .portrait{width:120px;aspect-ratio:4/5;border-radius:0}
.ceo .body{padding:16px 22px}
.ceo p{font-size:14.5px;margin-top:8px}
@media (max-width:480px){.ceo{grid-template-columns:96px minmax(0,1fr)}.ceo .portrait{width:96px}.ceo .body{padding:12px 16px}}
.t-portrait{width:clamp(96px,11vw,130px)!important}

.ceo{grid-template-columns:240px minmax(0,1fr)!important}
.ceo .portrait{width:240px!important}
@media (max-width:560px){.ceo{grid-template-columns:1fr!important}.ceo .portrait{width:100%!important;max-width:260px;margin:16px 0 0 16px;border-radius:10px}}
.t-portrait{width:clamp(160px,22vw,260px)!important}
.homes{display:flex;flex-direction:column;gap:clamp(40px,6vw,64px);margin-top:32px}
.home-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 24px;border-bottom:1px solid var(--line);padding-bottom:14px}
.home-head h3{font-size:clamp(19px,2.2vw,24px);font-weight:600}
.home-head p{margin:4px 0 0;color:var(--ink-2);font-size:14.5px}
.home-head a{color:var(--accent);font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px;margin-top:20px}
.room{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;color:inherit;font:inherit}
.room:hover,.room:focus-visible{border-color:var(--accent);outline:none}
.room .ph2{position:relative;aspect-ratio:4/3;max-width:100%;overflow:hidden;background:#0c1638}
.room .ph2 img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.room:hover .ph2 img{transform:scale(1.04)}
.room .count{position:absolute;right:10px;bottom:10px;background:rgba(5,10,28,.75);color:#fff;font-size:12px;padding:3px 9px;border-radius:999px}
.room .rb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:4px;flex:1}
.room .rb h4{margin:0;font-size:17px;font-weight:600}
.room .rb .d{color:var(--ink-2);font-size:14px}
.room .rb .pr{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:baseline}
.room .rb .pr b{font-size:18px;font-variant-numeric:tabular-nums}

const TBD=t=>`<span class="tbd">${t||'To fill'}</span>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BG={daleena:'radial-gradient(120% 90% at 80% 10%,#2D5E7E 0%,#12264F 55%,#0B1433 100%)',warisanku:'radial-gradient(120% 90% at 80% 10%,#5A4A3A 0%,#2A2440 55%,#0E1230 100%)',ahmed:'radial-gradient(120% 90% at 80% 10%,#2F6A68 0%,#153A4A 55%,#0B1A33 100%)',matsatay:'radial-gradient(120% 90% at 80% 10%,#6E5A2A 0%,#2E3A2C 55%,#0E1A22 100%)'};
const on=r=>!/^(n|no)$/i.test(String(r.show_on_site??'').trim());
const HQ=DB.Businesses.find(b=>b.biz_id==='kbkcitrawaja');
const BIZ=DB.Businesses.filter(b=>on(b)&&b.biz_id!=='kbkcitrawaja'&&b.name).sort((a,b)=>(a.sort??99)-(b.sort??99));
const by=(t,id)=>DB[t].filter(r=>r.biz_id===id&&on(r));
const rm=v=>{const n=Number(v);return 'RM'+(Number.isInteger(n)?n:n.toFixed(2))};
const fix=r=>{if((r.price_min_rm==null||r.price_min_rm==='')&&r.unit!=null&&!isNaN(Number(r.unit))&&String(r.unit).trim()!==''){r.price_min_rm=Number(r.unit);r.unit='per transaction'}return r};
const priceTxt=r=>r.price_min_rm==null||r.price_min_rm===''?'<span style="color:var(--ink-2);font-weight:400">Ask us</span>':(r.price_max_rm?rm(r.price_min_rm)+'–'+String(r.price_max_rm):rm(r.price_min_rm));
const fbOk=u=>/^https:\/\/(www\.)?facebook\.com\//.test(String(u||''));
const wa=n=>'https://wa.me/'+String(n).replace(/\D/g,'');

 <div class="t-portrait"><img src="${CEO}" alt="Ku Mohd Afif Bin Ku Ishak, Founder and CEO of KBK Citra Waja"></div>
 <div><div class="eyebrow">Our story</div><h2 style="margin-top:10px">It started with our own front door</h2>
 <p class="lead" style="margin-top:14px">In July 2024 we listed our family home in Sungai Petani on Airbnb. Then, while still working full-time as an engineer, we turned an old shop lot into two guest homes, learned a new trade, rebuilt a damaged building into a 9-room inn and opened a satay kedai.</p>
 <p style="color:var(--ink-2);margin:10px 0 22px">Two years later, four of our businesses stand side by side on one row in Kodiang. Here’s how it happened, chapter by chapter.</p>

<section id="why"><div class="eyebrow">Why one platform</div><h2 style="margin-top:10px">Everything we do, in one place</h2>

    const fmt=d=>d?new Date(d+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'-';
    const msg=`Hi D'Aleena Collection, I would like to book:\n\n`+
      `Property: ${l.name}\nRoom: ${item} (${rm(price)}/night)\nCheck-in: ${fmt(ci)}\nCheck-out: ${fmt(co)}${nights>0?` (${nights} night${nights>1?'s':''})`:''}\nGuests: ${g||'-'}\nName: ${n||'-'}\n\nPlease confirm availability. Thank you.`;
    el.querySelector('#bgo').href=wa(b.whatsapp)+'?text='+encodeURIComponent(msg)};
  el.querySelector('#bform').addEventListener('input',upd);upd();
  const close=()=>{CUR=null;el.hidden=true;el.innerHTML='';document.body.style.overflow='';document.removeEventListener('keydown',key);OV?.focus()};
  const key=e=>{if(e.key==='Escape')close();if(e.key==='ArrowRight'&&e.target.tagName!=='INPUT')show(CUR.i+1);if(e.key==='ArrowLeft'&&e.target.tagName!=='INPUT')show(CUR.i-1)};
  el.querySelector('#ovx').onclick=close;el.onclick=e=>{if(e.target===el)close()};document.addEventListener('keydown',key);
  el.hidden=false;document.body.style.overflow='hidden';drawGallery();el.querySelector('#ovx').focus();
}

function priceGroups(id){

  const P=by('Prices',id).map(fix).sort((a,b)=>a.sort-b.sort),cats=[...new Set(P.map(p=>p.category))];
  return cats.map(c=>{const rs=P.filter(p=>p.category===c);let prev=null,out='';

      if(multi){if(r.item!==prev)out+=`<div class="subhead">${esc(r.item)}</div>`;out+=`<div class="row tier"><span>${esc(r.detail)}</span><span class="price">${priceTxt(r)}</span></div>`}
